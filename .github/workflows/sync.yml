name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: Sync Upstream
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            try {
              // Backup user's wrangler.json (if exists and contains database_id)
              const wranglerPath = '_workers_next/wrangler.json';
              let userWrangler = null;
              
              if (fs.existsSync(wranglerPath)) {
                const content = fs.readFileSync(wranglerPath, 'utf8');
                // Only backup if user has customized it (contains d1_databases)
                if (content.includes('d1_databases')) {
                  userWrangler = content;
                  console.log('📦 Backed up user wrangler.json with D1 config');
                }
              }
              
              // Configure Git
              await exec.exec('git', ['config', '--global', 'user.name', 'GitHub Actions']);
              await exec.exec('git', ['config', '--global', 'user.email', 'actions@github.com']);

              // Add Upstream
              await exec.exec('git', ['remote', 'add', 'upstream', 'https://github.com/chatgptuk/ldc-shop.git']);
              await exec.exec('git', ['fetch', 'upstream']);

              // Merge upstream updates while preserving this repository's changes.
              // Conflicts fail the job before any push so they can be resolved manually.
              await exec.exec('git', ['checkout', 'main']);
              await exec.exec('git', ['merge', '--no-edit', 'upstream/main']);
              
              // Restore user's wrangler.json if it was backed up
              if (userWrangler) {
                fs.writeFileSync(wranglerPath, userWrangler);
                await exec.exec('git', ['add', wranglerPath]);
              }

              // Keep the retired root Vercel application out of this fork,
              // including new legacy files introduced by upstream updates.
              const retiredVercelPaths = [
                'src', 'lib', 'public', '.dockerignore', 'Dockerfile',
                'docker-compose.yml', 'entrypoint.sh', 'components.json',
                'drizzle.config.ts', 'eslint.config.mjs', 'next.config.ts',
                'package.json', 'package-lock.json', 'postcss.config.mjs',
                'tsconfig.json', 'vercel.json', 'scripts/export-data.ts',
              ];
              await exec.exec('git', ['rm', '-r', '--ignore-unmatch', '--', ...retiredVercelPaths]);

              let hasChanges = false;
              try {
                await exec.exec('git', ['diff', '--cached', '--quiet']);
              } catch (e) {
                hasChanges = true;
              }
              if (hasChanges) {
                await exec.exec('git', ['commit', '-m', 'chore: preserve fork configuration and remove retired Vercel files']);
              }

              // A normal push also protects against concurrent remote updates.
              await exec.exec('git', ['push', 'origin', 'main']);
              
            } catch (error) {
              core.setFailed(`Sync failed: ${error.message}`);
            }
