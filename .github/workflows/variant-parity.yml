name: Workers and Docker Parity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  business-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-variants.mjs --check
