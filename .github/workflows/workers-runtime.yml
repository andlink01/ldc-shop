name: Workers Runtime Validation

on:
  push:
    branches: [main]
    paths: ['_workers_next/**', '.github/workflows/workers-runtime.yml']
  pull_request:
    paths: ['_workers_next/**', '.github/workflows/workers-runtime.yml']

permissions:
  contents: read

jobs:
  workers-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _workers_next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _workers_next/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:auth
      - run: npm run test:inventory
      - run: npm run test:db
      - run: npm run test:update
      - run: npm run test:client
      - run: npm run test:card-config
      - run: npm run test:features
      - run: npm run test:storefront
      - run: npm run test:runtime
      - run: npm run build
      - run: npx opennextjs-cloudflare build --skipNextBuild
      - run: npm run test:production
